name: Workers Deploy
description: >-
  Deploys the calling repository's app to Cloudflare Workers, standalone:
  checks the repository out, keeps its pnpm-lock.yaml in step with its
  package.json, installs against the published @karasu-lab/* packages,
  builds for the detected project type — Next.js via OpenNext, ElysiaJS
  via Vite — and converges on a single Workers deployment (production
  deploy, or a per-branch Preview), pruning old Previews afterwards.
  Alternatively assembles the workspace from a monorepo, initializing
  only the listed submodules.
author: Karasu Lab
branding:
  icon: upload-cloud
  color: orange

inputs:
  mode:
    description: "production deploys the worker; preview deploys a branch Preview"
    required: true
  worker-name:
    description: "Name of the Cloudflare Worker (also the name whose Previews are pruned)"
    required: true
  monorepo:
    description: >-
      Optional monorepo (owner/name) to assemble the workspace from. When
      set, the calling repository is not checked out on its own: the
      monorepo is cloned without its submodules, and only app-path and the
      paths listed in submodules are initialized. app-path is then pinned
      to the triggering commit.
    required: false
    default: ""
  monorepo-branch:
    description: "Monorepo branch cloned for the assembly"
    required: false
    default: dev
  app-path:
    description: "App directory inside the assembled workspace (required with monorepo)"
    required: false
    default: "."
  submodules:
    description: >-
      Space- or newline-separated submodule paths to initialize besides
      app-path, used with monorepo. Submodules that are not listed are
      never cloned.
    required: false
    default: ""
  secret-names:
    description: >-
      Optional space-separated names of the secrets the worker cannot
      run without. A name with no value is skipped, like every other
      name the app declares in env-file: what is passed to the worker
      is whatever the caller's contexts provide, so no name has to be
      listed per environment. When this is empty, every name in
      vars-json and secrets-json, and every variable the caller sets in
      its job env, is passed on its own, except the deploy credentials
      and the names the wrangler config defines.
    required: false
    default: ""
  reset-secrets:
    description: >-
      In production, delete the worker secrets that the caller no longer
      provides, so that the worker's secrets are exactly the ones resolved
      from the caller's contexts. A deployment never deletes secrets on
      its own, so a variable or secret removed from the repository would
      otherwise stay on the worker. Set to "false" to only add and update.
    required: false
    default: "true"
  env-file:
    description: >-
      File in the app directory that declares the names the app reads
      (KEY= lines). Names declared here are passed to the worker when
      they have a value, except those the wrangler config already
      defines as vars.
    required: false
    default: ".env.example"
  vars-json:
    description: "The caller's vars context as JSON (toJSON of vars); every name is read from it unless secret-names is set, in which case only the names the app declares or requires are"
    required: false
    default: "{}"
  secrets-json:
    description: "The caller's secrets context as JSON (toJSON of secrets); every name is read from it unless secret-names is set, in which case only the names the app declares or requires are"
    required: false
    default: "{}"
  preview-args:
    description: "Optional extra arguments for the Preview command. Placeholder: {branch}"
    required: false
    default: ""
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  pnpm-version:
    description: >-
      pnpm version, used when the app does not pin one itself through
      the packageManager field (the api apps rely on this default)
    required: false
    default: "12.15.0"
  keep-previews:
    description: "How many of the newest Previews to keep"
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      if: inputs.monorepo == ''
      uses: actions/checkout@v4

    - name: Assemble the workspace from the monorepo
      if: inputs.monorepo != ''
      shell: bash
      env:
        APP_SHA: ${{ github.sha }}
        MONOREPO: ${{ inputs.monorepo }}
        MONOREPO_BRANCH: ${{ inputs.monorepo-branch }}
        APP_PATH: ${{ inputs.app-path }}
        SUBMODULES: ${{ inputs.submodules }}
      run: |
        git clone --branch "$MONOREPO_BRANCH" --no-recurse-submodules "https://github.com/${MONOREPO}.git" .
        set -f
        PATHS=($SUBMODULES)
        set +f
        git submodule update --init -- "$APP_PATH" "${PATHS[@]}"
        git -C "$APP_PATH" fetch origin "$APP_SHA"
        git -C "$APP_PATH" checkout "$APP_SHA"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://npm.pkg.github.com
        scope: "@karasu-lab"

    - name: Detect the project type
      id: detect
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/bin/detect-project-type.ts"

    - name: Resolve the app's variables and worker secrets
      id: secrets
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        SECRET_NAMES: ${{ inputs.secret-names }}
        ENV_FILE: ${{ inputs.env-file }}
        VARS_JSON: ${{ inputs.vars-json }}
        SECRETS_JSON: ${{ inputs.secrets-json }}
        CALLER_ENV_JSON: ${{ toJSON(env) }}
      run: node "$ACTION_PATH/scripts/bin/resolve-secrets.ts"

    - name: Resolve the pnpm version
      id: pnpm
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REQUESTED: ${{ inputs.pnpm-version }}
      run: node "$ACTION_PATH/scripts/bin/resolve-pnpm-version.ts"

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.pnpm.outputs.version }}

    - name: Regenerate the lockfile if package.json moved
      if: inputs.monorepo == ''
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        pnpm install --lockfile-only
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pnpm-lock.yaml
        if git diff --cached --quiet; then
          echo "pnpm-lock.yaml is up to date"
          exit 0
        fi
        git commit -m "chore: regenerate pnpm-lock.yaml [skip ci]"
        for attempt in 1 2 3; do
          if git push; then
            exit 0
          fi
          git pull --rebase origin "$BRANCH"
        done
        git push

    - name: Install dependencies
      shell: bash
      env:
        MONOREPO: ${{ inputs.monorepo }}
        APP_PATH: ${{ inputs.app-path }}
      run: |
        if [ -n "$MONOREPO" ]; then
          pnpm install --frozen-lockfile --filter "./${APP_PATH}..."
        else
          pnpm install --frozen-lockfile
        fi

    - name: Build a Next.js app
      if: steps.detect.outputs.project-type == 'nextjs'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec opennextjs-cloudflare build

    - name: Populate the OpenNext cache
      if: steps.detect.outputs.project-type == 'nextjs'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec opennextjs-cloudflare populateCache local

    - name: Build an ElysiaJS app
      if: steps.detect.outputs.project-type == 'elysia'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec vite build

    - name: Build a generic app
      if: steps.detect.outputs.project-type == 'generic'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: |
        if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
          pnpm build
        fi

    - name: Deploy to production
      if: inputs.mode == 'production'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec wrangler deploy

    - name: Sync the worker secrets in production
      if: inputs.mode == 'production' && (steps.secrets.outputs.has-secrets == 'true' || inputs.reset-secrets == 'true')
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        HAS_SECRETS: ${{ steps.secrets.outputs.has-secrets }}
        RESET_SECRETS: ${{ inputs.reset-secrets }}
      run: node "$ACTION_PATH/scripts/bin/sync-secrets.ts"

    - name: Deploy the branch Preview
      if: inputs.mode == 'preview'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        BRANCH: ${{ github.ref_name }}
        PREVIEW_ARGS: ${{ inputs.preview-args }}
        HAS_SECRETS: ${{ steps.secrets.outputs.has-secrets }}
      run: node "$ACTION_PATH/scripts/bin/deploy-preview.ts"

    - name: Prune old Previews
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKER_NAME: ${{ inputs.worker-name }}
        KEEP: ${{ inputs.keep-previews }}
        CURRENT_BRANCH: ${{ github.ref_name }}
        APP_DIR: ${{ inputs.app-path }}
      run: node "$ACTION_PATH/scripts/bin/prune-previews.ts" || true
