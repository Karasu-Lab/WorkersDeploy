name: Workers Deploy
description: >-
  Deploys the calling repository's app to Cloudflare Workers, standalone:
  checks the repository out, keeps its pnpm-lock.yaml in step with its
  package.json, installs against the published @karasu-lab/* packages,
  builds for the detected project type — Next.js via OpenNext, ElysiaJS
  via Vite — and deploys it. The default branch deploys production; every
  other branch deploys the preview worker (the wrangler environment named
  by preview-env). The variables and secrets of the job's GitHub
  environment are bound to the worker when it is uploaded. Alternatively
  assembles the workspace from a monorepo, initializing only the listed
  submodules.
author: Karasu Lab
branding:
  icon: upload-cloud
  color: orange

inputs:
  mode:
    description: >-
      auto (the default) deploys production from the repository's default
      branch and the preview worker from every other branch. production or
      preview forces one of them.
    required: false
    default: auto
  preview-env:
    description: "Name of the wrangler environment of the preview worker, selected through CLOUDFLARE_ENV when the mode is preview"
    required: false
    default: dev
  exclude:
    description: >-
      Space-separated names of the variables and secrets that must not be
      passed to the worker, besides the names the action never passes
      (CLOUDFLARE_API_TOKEN, GITHUB_*, ACTIONS_*, RUNNER_*, NODE_AUTH_TOKEN
      and github_token).
    required: false
    default: ""
  monorepo:
    description: >-
      Optional monorepo (owner/name) to assemble the workspace from. When
      set, the calling repository is not checked out on its own: the
      monorepo is cloned without its submodules, and only app-path and the
      paths listed in submodules are initialized. app-path is then pinned
      to the triggering commit.
    required: false
    default: ""
  monorepo-branch:
    description: "Monorepo branch cloned for the assembly"
    required: false
    default: dev
  app-path:
    description: "App directory inside the assembled workspace (required with monorepo)"
    required: false
    default: "."
  submodules:
    description: >-
      Space- or newline-separated submodule paths to initialize besides
      app-path, used with monorepo. Submodules that are not listed are
      never cloned.
    required: false
    default: ""
  reset-secrets:
    description: >-
      Delete the worker secrets that are not among the secrets passed, so
      that the worker's secrets are exactly the ones the job's environment
      holds. A deployment never deletes secrets on its own, so a secret
      removed from the repository would otherwise stay on the worker. Set to
      "false" to only add and update.
    required: false
    default: "true"
  vars-json:
    description: "The caller's vars context as JSON (toJSON of vars). The job's GitHub environment decides which values it holds, and a value of the environment wins over one of the repository or the organization. Every entry is bound to the worker as a variable"
    required: false
    default: "{}"
  secrets-json:
    description: "The caller's secrets context as JSON (toJSON of secrets). The job's GitHub environment decides which values it holds, and a value of the environment wins over one of the repository or the organization. Every entry is bound to the worker as a secret, and wins over a variable of the same name"
    required: false
    default: "{}"
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  pnpm-version:
    description: >-
      pnpm version, used when the app does not pin one itself through
      the packageManager field (the api apps rely on this default)
    required: false
    default: "12.15.0"

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      if: inputs.monorepo == ''
      uses: actions/checkout@v4

    - name: Assemble the workspace from the monorepo
      if: inputs.monorepo != ''
      shell: bash
      env:
        APP_SHA: ${{ github.sha }}
        MONOREPO: ${{ inputs.monorepo }}
        MONOREPO_BRANCH: ${{ inputs.monorepo-branch }}
        APP_PATH: ${{ inputs.app-path }}
        SUBMODULES: ${{ inputs.submodules }}
      run: |
        git clone --branch "$MONOREPO_BRANCH" --no-recurse-submodules "https://github.com/${MONOREPO}.git" .
        set -f
        PATHS=($SUBMODULES)
        set +f
        git submodule update --init -- "$APP_PATH" "${PATHS[@]}"
        git -C "$APP_PATH" fetch origin "$APP_SHA"
        git -C "$APP_PATH" checkout "$APP_SHA"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://npm.pkg.github.com
        scope: "@karasu-lab"

    - name: Detect the project type
      id: detect
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/bin/detect-project-type.ts"

    - name: Resolve the deployment environment, variables and secrets
      id: environment
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        MODE: ${{ inputs.mode }}
        PREVIEW_ENV: ${{ inputs.preview-env }}
        EXCLUDE: ${{ inputs.exclude }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        VARS_JSON: ${{ inputs.vars-json }}
        SECRETS_JSON: ${{ inputs.secrets-json }}
      run: node "$ACTION_PATH/scripts/bin/resolve-environment.ts"

    - name: Resolve the pnpm version
      id: pnpm
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REQUESTED: ${{ inputs.pnpm-version }}
      run: node "$ACTION_PATH/scripts/bin/resolve-pnpm-version.ts"

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.pnpm.outputs.version }}

    - name: Regenerate the lockfile if package.json moved
      if: inputs.monorepo == ''
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: |
        pnpm install --lockfile-only
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pnpm-lock.yaml
        if git diff --cached --quiet; then
          echo "pnpm-lock.yaml is up to date"
          exit 0
        fi
        git commit -m "chore: regenerate pnpm-lock.yaml [skip ci]"
        for attempt in 1 2 3; do
          if git push; then
            exit 0
          fi
          git pull --rebase origin "$BRANCH"
        done
        git push

    - name: Install dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
        MONOREPO: ${{ inputs.monorepo }}
        APP_PATH: ${{ inputs.app-path }}
      run: |
        if [ -n "$MONOREPO" ]; then
          pnpm install --frozen-lockfile --filter "./${APP_PATH}..."
        else
          pnpm install --frozen-lockfile
        fi

    - name: Build a Next.js app
      if: steps.detect.outputs.project-type == 'nextjs'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec opennextjs-cloudflare build

    - name: Populate the OpenNext cache
      if: steps.detect.outputs.project-type == 'nextjs'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec opennextjs-cloudflare populateCache local

    - name: Build an ElysiaJS app
      if: steps.detect.outputs.project-type == 'elysia'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec vite build

    - name: Build a generic app
      if: steps.detect.outputs.project-type == 'generic'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: |
        if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
          pnpm build
        fi

    - name: Deploy the worker
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        HAS_VARS: ${{ steps.environment.outputs.has-vars }}
        HAS_SECRETS: ${{ steps.environment.outputs.has-secrets }}
      run: node "$ACTION_PATH/scripts/bin/deploy.ts"

    - name: Remove the worker secrets that are no longer provided
      if: inputs.reset-secrets == 'true'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        HAS_SECRETS: ${{ steps.environment.outputs.has-secrets }}
        RESET_SECRETS: ${{ inputs.reset-secrets }}
      run: node "$ACTION_PATH/scripts/bin/sync-secrets.ts"
