name: Workers Deploy
description: >-
  Deploys the calling repository's app to Cloudflare Workers, standalone:
  checks the repository out, keeps its pnpm-lock.yaml in step with its
  package.json, installs against the published @karasu-lab/* packages,
  builds for the detected project type — Next.js via OpenNext, ElysiaJS
  via Vite — and converges on a single Workers deployment (production
  deploy, or a per-branch Preview), pruning old Previews afterwards.
  Alternatively assembles the workspace from a monorepo, initializing
  only the listed submodules.
author: Karasu Lab
branding:
  icon: upload-cloud
  color: orange

inputs:
  mode:
    description: "production deploys the worker; preview deploys a branch Preview"
    required: true
  worker-name:
    description: "Name of the Cloudflare Worker (also the name whose Previews are pruned)"
    required: true
  monorepo:
    description: >-
      Optional monorepo (owner/name) to assemble the workspace from. When
      set, the calling repository is not checked out on its own: the
      monorepo is cloned without its submodules, and only app-path and the
      paths listed in submodules are initialized. app-path is then pinned
      to the triggering commit.
    required: false
    default: ""
  monorepo-branch:
    description: "Monorepo branch cloned for the assembly"
    required: false
    default: dev
  app-path:
    description: "App directory inside the assembled workspace (required with monorepo)"
    required: false
    default: "."
  submodules:
    description: >-
      Space- or newline-separated submodule paths to initialize besides
      app-path, used with monorepo. Submodules that are not listed are
      never cloned.
    required: false
    default: ""
  secret-names:
    description: >-
      Optional space-separated names exposed to the worker as secrets.
      Their values are read from the environment; they are written to a
      secrets file used by the Preview and, in production, synced with
      wrangler secret bulk. The deployment fails when any name has no
      value.
    required: false
    default: ""
  optional-secret-names:
    description: >-
      Optional space-separated names exposed to the worker as secrets
      like secret-names, except that names with no value are skipped
      instead of failing the deployment.
    required: false
    default: ""
  preview-args:
    description: "Optional extra arguments for the Preview command. Placeholder: {branch}"
    required: false
    default: ""
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  pnpm-version:
    description: >-
      pnpm version, used when the app does not pin one itself through
      the packageManager field (the api apps rely on this default)
    required: false
    default: "12.15.0"
  keep-previews:
    description: "How many of the newest Previews to keep"
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      if: inputs.monorepo == ''
      uses: actions/checkout@v4

    - name: Assemble the workspace from the monorepo
      if: inputs.monorepo != ''
      shell: bash
      env:
        APP_SHA: ${{ github.sha }}
        MONOREPO: ${{ inputs.monorepo }}
        MONOREPO_BRANCH: ${{ inputs.monorepo-branch }}
        APP_PATH: ${{ inputs.app-path }}
        SUBMODULES: ${{ inputs.submodules }}
      run: |
        git clone --branch "$MONOREPO_BRANCH" --no-recurse-submodules "https://github.com/${MONOREPO}.git" .
        set -f
        PATHS=($SUBMODULES)
        set +f
        git submodule update --init -- "$APP_PATH" "${PATHS[@]}"
        git -C "$APP_PATH" fetch origin "$APP_SHA"
        git -C "$APP_PATH" checkout "$APP_SHA"

    - name: Detect the project type
      id: detect
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: |
        TYPE=$(jq -r '(.dependencies // {}) + (.devDependencies // {})
          | if has("next") then "nextjs" elif has("elysia") then "elysia" else "generic" end' package.json)
        echo "Detected project type: $TYPE"
        echo "project-type=$TYPE" >> "$GITHUB_OUTPUT"

    - name: Resolve the pnpm version
      id: pnpm
      shell: bash
      env:
        REQUESTED: ${{ inputs.pnpm-version }}
      run: |
        PINNED=$(node -p "require('./package.json').packageManager?.split('@')[1] ?? ''" 2>/dev/null || true)
        echo "version=${PINNED:-$REQUESTED}" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://npm.pkg.github.com
        scope: "@karasu-lab"

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.pnpm.outputs.version }}

    - name: Regenerate the lockfile if package.json moved
      if: inputs.monorepo == ''
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        pnpm install --lockfile-only
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pnpm-lock.yaml
        if git diff --cached --quiet; then
          echo "pnpm-lock.yaml is up to date"
          exit 0
        fi
        git commit -m "chore: regenerate pnpm-lock.yaml [skip ci]"
        for attempt in 1 2 3; do
          if git push; then
            exit 0
          fi
          git pull --rebase origin "$BRANCH"
        done
        git push

    - name: Install dependencies
      shell: bash
      env:
        MONOREPO: ${{ inputs.monorepo }}
        APP_PATH: ${{ inputs.app-path }}
      run: |
        if [ -n "$MONOREPO" ]; then
          pnpm install --frozen-lockfile --filter "./${APP_PATH}..."
        else
          pnpm install --frozen-lockfile
        fi

    - name: Build a Next.js app
      if: steps.detect.outputs.project-type == 'nextjs'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec opennextjs-cloudflare build

    - name: Build an ElysiaJS app
      if: steps.detect.outputs.project-type == 'elysia'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec vite build

    - name: Build a generic app
      if: steps.detect.outputs.project-type == 'generic'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: |
        if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
          pnpm build
        fi

    - name: Write the worker secrets file
      if: inputs.secret-names != '' || inputs.optional-secret-names != ''
      shell: bash
      env:
        SECRET_NAMES: ${{ inputs.secret-names }}
        OPTIONAL_SECRET_NAMES: ${{ inputs.optional-secret-names }}
      run: |
        NAMES=()
        MISSING=()
        for NAME in $SECRET_NAMES; do
          if [ -z "${!NAME:-}" ]; then
            MISSING+=("$NAME")
          else
            NAMES+=("$NAME")
          fi
        done
        if [ ${#MISSING[@]} -gt 0 ]; then
          echo "::error::No value is set for: ${MISSING[*]}"
          exit 1
        fi
        SKIPPED=()
        for NAME in $OPTIONAL_SECRET_NAMES; do
          if [ -z "${!NAME:-}" ]; then
            SKIPPED+=("$NAME")
          else
            NAMES+=("$NAME")
          fi
        done
        SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
        echo "SECRETS_FILE=$SECRETS_FILE" >> "$GITHUB_ENV"
        (umask 077 && jq -n '$ARGS.positional | map({key: ., value: env[.]}) | from_entries' --args "${NAMES[@]}" > "$SECRETS_FILE")
        echo "Wrote the secrets: ${NAMES[*]}"
        if [ ${#SKIPPED[@]} -gt 0 ]; then
          echo "Skipped the optional secrets with no value: ${SKIPPED[*]}"
        fi

    - name: Deploy to production
      if: inputs.mode == 'production'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec wrangler deploy

    - name: Sync the worker secrets in production
      if: inputs.mode == 'production' && (inputs.secret-names != '' || inputs.optional-secret-names != '')
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec wrangler secret bulk "$SECRETS_FILE"

    - name: Deploy the branch Preview
      if: inputs.mode == 'preview'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        BRANCH: ${{ github.ref_name }}
        PREVIEW_ARGS: ${{ inputs.preview-args }}
        HAS_SECRETS: ${{ inputs.secret-names != '' || inputs.optional-secret-names != '' }}
      run: |
        ARGS=()
        if [ "$HAS_SECRETS" = "true" ]; then
          ARGS+=(--secrets-file "$SECRETS_FILE")
        fi
        if [ -n "$PREVIEW_ARGS" ]; then
          EXPANDED="${PREVIEW_ARGS//\{branch\}/$BRANCH}"
          # Word splitting is intended: preview-args is a list of arguments.
          read -r -a EXTRA <<< "$EXPANDED"
          ARGS+=("${EXTRA[@]}")
        fi
        pnpm exec wrangler preview --name "$BRANCH" "${ARGS[@]}"

    - name: Prune old Previews
      shell: bash
      env:
        WORKER_NAME: ${{ inputs.worker-name }}
        KEEP: ${{ inputs.keep-previews }}
        CURRENT_BRANCH: ${{ github.ref_name }}
        APP_DIR: ${{ inputs.app-path }}
      run: |
        set +e
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::warning::prune-previews: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required; skipping"
          exit 0
        fi
        API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER_NAME/previews"
        CURRENT_SLUG="${CURRENT_BRANCH//[^a-zA-Z0-9-]/-}"

        if LIST=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API") \
          && STALE=$(jq -r --argjson keep "$KEEP" --arg current "$CURRENT_BRANCH" --arg slug "$CURRENT_SLUG" '
            (if type == "array" then . else .result end)
            | map({id: (.name // .id), time: (.created_on // .modified_on // "")})
            | map(select(.id))
            | sort_by(.time) | reverse
            | .[$keep:] | map(.id | select(. != $current and . != $slug)) | .[]' <<< "$LIST"); then
          :
        else
          echo "::warning::prune-previews: API listing unavailable; falling back to git branches"
          if ! git -C "$APP_DIR" fetch origin '+refs/heads/*:refs/remotes/prune/*'; then
            echo "::warning::prune-previews: git fallback failed; nothing pruned"
            exit 0
          fi
          STALE=$(git -C "$APP_DIR" for-each-ref --sort=-committerdate --format='%(refname:strip=3)' refs/remotes/prune \
            | grep -vxE 'HEAD|main' \
            | tail -n +$((KEEP + 1)) \
            | grep -vxF "$CURRENT_BRANCH" \
            | sed 's/[^a-zA-Z0-9-]/-/g')
        fi

        for ID in $STALE; do
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$(jq -rn --arg id "$ID" '$id | @uri')")
          if [ "${STATUS:0:1}" = "2" ] || [ "$STATUS" = "404" ]; then
            echo "deleted preview: $ID"
          else
            echo "::warning::prune-previews: could not delete preview $ID (HTTP $STATUS)"
          fi
        done
