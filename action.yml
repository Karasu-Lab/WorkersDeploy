name: Workers Deploy
description: >-
  Deploys the calling repository's app to Cloudflare Workers, standalone:
  checks the repository out, keeps its pnpm-lock.yaml in step with its
  package.json, installs against the published @karasu-lab/* packages,
  builds for the detected project type — Next.js via OpenNext, ElysiaJS
  via Vite — and converges on a single Workers deployment (production
  deploy, or a per-branch Preview), pruning old Previews afterwards.
  Alternatively assembles the workspace from a monorepo, initializing
  only the listed submodules.
author: Karasu Lab
branding:
  icon: upload-cloud
  color: orange

inputs:
  mode:
    description: "production deploys the worker; preview deploys a branch Preview"
    required: true
  worker-name:
    description: "Name of the Cloudflare Worker (also the name whose Previews are pruned)"
    required: true
  monorepo:
    description: >-
      Optional monorepo (owner/name) to assemble the workspace from. When
      set, the calling repository is not checked out on its own: the
      monorepo is cloned without its submodules, and only app-path and the
      paths listed in submodules are initialized. app-path is then pinned
      to the triggering commit.
    required: false
    default: ""
  monorepo-branch:
    description: "Monorepo branch cloned for the assembly"
    required: false
    default: dev
  app-path:
    description: "App directory inside the assembled workspace (required with monorepo)"
    required: false
    default: "."
  submodules:
    description: >-
      Space- or newline-separated submodule paths to initialize besides
      app-path, used with monorepo. Submodules that are not listed are
      never cloned.
    required: false
    default: ""
  secret-names:
    description: >-
      Optional space-separated names exposed to the worker as secrets.
      Their values are read from the environment; they are written to a
      secrets file used by the Preview and, in production, synced with
      wrangler secret bulk. Names with no value fall back to the app's
      env.local vars in its wrangler config, as before.
    required: false
    default: ""
  preview-args:
    description: "Optional extra arguments for the Preview command. Placeholder: {branch}"
    required: false
    default: ""
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  pnpm-version:
    description: >-
      pnpm version, used when the app does not pin one itself through
      the packageManager field (the api apps rely on this default)
    required: false
    default: "12.15.0"
  keep-previews:
    description: "How many of the newest Previews to keep"
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      if: inputs.monorepo == ''
      uses: actions/checkout@v4

    - name: Assemble the workspace from the monorepo
      if: inputs.monorepo != ''
      shell: bash
      env:
        APP_SHA: ${{ github.sha }}
        MONOREPO: ${{ inputs.monorepo }}
        MONOREPO_BRANCH: ${{ inputs.monorepo-branch }}
        APP_PATH: ${{ inputs.app-path }}
        SUBMODULES: ${{ inputs.submodules }}
      run: |
        git clone --branch "$MONOREPO_BRANCH" --no-recurse-submodules "https://github.com/${MONOREPO}.git" .
        set -f
        PATHS=($SUBMODULES)
        set +f
        git submodule update --init -- "$APP_PATH" "${PATHS[@]}"
        git -C "$APP_PATH" fetch origin "$APP_SHA"
        git -C "$APP_PATH" checkout "$APP_SHA"

    - name: Detect the project type
      id: detect
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: node "$GITHUB_ACTION_PATH/scripts/detect-project.mjs"

    - name: Resolve the pnpm version
      id: pnpm
      shell: bash
      env:
        REQUESTED: ${{ inputs.pnpm-version }}
      run: |
        PINNED=$(node -p "require('./package.json').packageManager?.split('@')[1] ?? ''" 2>/dev/null || true)
        echo "version=${PINNED:-$REQUESTED}" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://npm.pkg.github.com
        scope: "@karasu-lab"

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.pnpm.outputs.version }}

    - name: Regenerate the lockfile if package.json moved
      if: inputs.monorepo == ''
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        pnpm install --lockfile-only
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pnpm-lock.yaml
        if git diff --cached --quiet; then
          echo "pnpm-lock.yaml is up to date"
          exit 0
        fi
        git commit -m "chore: regenerate pnpm-lock.yaml [skip ci]"
        for attempt in 1 2 3; do
          if git push; then
            exit 0
          fi
          git pull --rebase origin "$BRANCH"
        done
        git push

    - name: Install dependencies
      shell: bash
      env:
        MONOREPO: ${{ inputs.monorepo }}
        APP_PATH: ${{ inputs.app-path }}
      run: |
        if [ -n "$MONOREPO" ]; then
          pnpm install --frozen-lockfile --filter "./${APP_PATH}..."
        else
          pnpm install --frozen-lockfile
        fi

    - name: Build a Next.js app
      if: steps.detect.outputs.project-type == 'nextjs'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec opennextjs-cloudflare build

    - name: Build an ElysiaJS app
      if: steps.detect.outputs.project-type == 'elysia'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec vite build

    - name: Build a generic app
      if: steps.detect.outputs.project-type == 'generic'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: |
        if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
          pnpm build
        fi

    - name: Write the worker secrets file
      if: inputs.secret-names != ''
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        SECRET_NAMES: ${{ inputs.secret-names }}
      run: |
        SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
        echo "SECRETS_FILE=$SECRETS_FILE" >> "$GITHUB_ENV"
        node "$GITHUB_ACTION_PATH/scripts/worker-secrets-file.mjs" . "$SECRETS_FILE" $SECRET_NAMES

    - name: Deploy to production
      if: inputs.mode == 'production'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec wrangler deploy

    - name: Sync the worker secrets in production
      if: inputs.mode == 'production' && inputs.secret-names != ''
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: pnpm exec wrangler secret bulk "$SECRETS_FILE"

    - name: Deploy the branch Preview
      if: inputs.mode == 'preview'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        BRANCH: ${{ github.ref_name }}
        PREVIEW_ARGS: ${{ inputs.preview-args }}
        HAS_SECRETS: ${{ inputs.secret-names != '' }}
      run: |
        ARGS=()
        if [ "$HAS_SECRETS" = "true" ]; then
          ARGS+=(--secrets-file "$SECRETS_FILE")
        fi
        if [ -n "$PREVIEW_ARGS" ]; then
          EXPANDED="${PREVIEW_ARGS//\{branch\}/$BRANCH}"
          # Word splitting is intended: preview-args is a list of arguments.
          read -r -a EXTRA <<< "$EXPANDED"
          ARGS+=("${EXTRA[@]}")
        fi
        pnpm exec wrangler preview --name "$BRANCH" "${ARGS[@]}"

    - name: Prune old Previews
      shell: bash
      env:
        WORKER_NAME: ${{ inputs.worker-name }}
        KEEP: ${{ inputs.keep-previews }}
        CURRENT_BRANCH: ${{ github.ref_name }}
        APP_DIR: ${{ inputs.app-path }}
      run: node "$GITHUB_ACTION_PATH/scripts/prune-previews.mjs"
